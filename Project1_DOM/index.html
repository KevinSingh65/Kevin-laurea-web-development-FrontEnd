<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Project_DOM</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <h1>UNIVERSITY WORK SCHEDULE</h1>
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Add To-Do">

        <button type="submit">ADD</button>       
    </form>

    <p id="errorMessage"></p>
        
    <ul id="todo-list"></ul>

    <div id="filters">
        <button type="button" id="all-button">ALL</button>
        <button type="button" id="active-button">ACTIVE</button>
        <button type="button" id="done-button">DONE</button>

        <p id="task-counter">Tasks Left: 0</p>
    </div>

</body>
</html>
